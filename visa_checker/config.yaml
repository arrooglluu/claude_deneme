# ============================================================
#  VİZE RANDEVU TAKİP SİSTEMİ - YAPILANDIRMA DOSYASI
# ============================================================

# --- Telegram ---
telegram:
  bot_token: "BURAYA_BOT_TOKEN_YAZ"   # BotFather'dan alınan token
  chat_id: "BURAYA_CHAT_ID_YAZ"       # /getMyId botundan öğrenilen ID

# --- E-posta ---
email:
  enabled: true
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  sender: "seninadresin@gmail.com"
  password: "GMAIL_UYGULAMA_SIFRESI"  # Gmail App Password (MFA açıksa)
  recipients:
    - "seninadresin@gmail.com"

# --- Kontrol ayarları ---
check_interval_minutes: 5   # Kaç dakikada bir kontrol yapılsın
headless: true               # true = tarayıcı arka planda çalışır

# --- Takip edilecek konsolosluklar ---
targets:

  # iDATA - İtalya
  - id: "idata_italy"
    enabled: true
    center: "IDATA"
    country: "İtalya"
    url: "https://www.idata.com.tr/ita/tr/p/randevu-islemleri-ita"
    city_filter: "istanbul"
    category_filter: "turizm"   # Sadece İstanbul randevularını filtrele

  # VFS Global - Çekya
  - id: "vfs_czechia"
    enabled: true
    center: "VFS"
    country: "Çekya"
    url: "https://visa.vfsglobal.com/tur/tr/cze/book-an-appointment"
    city_filter: "Istanbul"

  # AS Visa - Macaristan
  - id: "asvisa_hungary"
    enabled: true
    center: "ASVISA"
    country: "Macaristan"
    url: "https://appointment.as-visa.com/tr/istanbul-bireysel-basvuru"
    city_filter: "istanbul"
    category_filter: "turizm"

  # VFS Global - Hollanda
  - id: "vfs_netherlands"
    enabled: true
    center: "VFS"
    country: "Hollanda"
    url: "https://visa.vfsglobal.com/tur/tr/nld/book-an-appointment"
    city_filter: "Istanbul"

  # VFS Global - İngiltere (devre dışı)
  - id: "vfs_uk"
    enabled: false
    center: "VFS"
    country: "İngiltere"
    url: "https://www.vfsglobal.co.uk/tur/english/book-an-appointment"
    city_filter: "Istanbul"

  # VFS Global - Avusturya
  - id: "vfs_austria"
    enabled: true
    center: "VFS"
    country: "Avusturya"
    url: "https://visa.vfsglobal.com/tur/tr/aut/book-an-appointment"
    city_filter: "Istanbul"

  # BLS International - İspanya
  - id: "bls_spain"
    enabled: true
    center: "BLS"
    country: "İspanya"
    url: "https://tr.blsinternational.com/spain/appointment.php"
    city_filter: "Istanbul"
